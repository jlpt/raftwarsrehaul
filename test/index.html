<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}#c{width:640px;height:480px}</style>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = { autoplay: "on", unmuteOverlay: "hidden", splashScreen: false, letterbox: "off", logLevel: "info", allowScriptAccess: true };
</script>
<script src="ruffle/ruffle.js"></script>
</head><body><div id="c"></div>
<script>
window.addEventListener('load', () => {
  const player = window.RufflePlayer.newest().createPlayer();
  player.style.width = '640px'; player.style.height = '480px';
  document.getElementById('c').appendChild(player);
  window.player = player;
  player.load({ url: 'game.swf', allowScriptAccess: true, autoplay: "on", unmuteOverlay: "hidden", splashScreen: false, logLevel: "info" })
    .then(() => { window.__loaded = true; }).catch(e => { window.__err = String(e); });
});
</script></body></html>
